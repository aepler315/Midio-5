# Reusable validation for pull requests and the Pages deployment gate.
name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install game dependencies
        run: npm ci --no-fund
      - name: Audit game dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Run test suite
        run: npm test

  audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install game dependencies
        run: npm ci --no-fund
      - name: Audit game dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise audio upload and playback
        run: |
          mkdir -p .smoke
          HOST=127.0.0.1 node tools/serve.js > .smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:smoke -- http://127.0.0.1:8080
          npm run test:lighting -- http://127.0.0.1:8080
          npm run test:shading -- http://127.0.0.1:8080
          npm run test:seek -- http://127.0.0.1:8080
          npm run test:worlds -- http://127.0.0.1:8080
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audio-smoke
          path: .smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  world-chooser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install game dependencies
        run: npm ci --no-fund
      - name: Audit game dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise pointer and keyboard world selection
        run: |
          mkdir -p .smoke
          HOST=127.0.0.1 node tools/serve.js > .smoke/chooser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:chooser -- http://127.0.0.1:8080
          npm run test:chooser-keyboard -- http://127.0.0.1:8080
      - name: Upload chooser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: world-chooser
          path: .smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  polygon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polygon
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: polygon/package-lock.json
      - name: Install Polygon dependencies
        run: npm ci --no-fund
      - name: Audit Polygon dependencies
        run: npm audit --audit-level=high
      - name: Lint Polygon
        run: npm run lint
      - name: Typecheck Polygon
        run: npm run typecheck
      - name: Test Polygon
        run: npm test
      - name: Build Polygon
        run: npm run build
