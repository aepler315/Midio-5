# Reusable validation for pull requests and the Pages deployment gate.
name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the game
        uses: ./.github/actions/setup
      - name: Audit game dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Run test suite
        run: npm test

  audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the game
        uses: ./.github/actions/setup
        with:
          browser: true
      - name: Exercise audio upload and playback
        run: |
          mkdir -p .smoke
          HOST=127.0.0.1 node tools/serve.js > .smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:smoke -- http://127.0.0.1:8080
          npm run test:lighting -- http://127.0.0.1:8080
          npm run test:shading -- http://127.0.0.1:8080
          npm run test:seek -- http://127.0.0.1:8080
          npm run test:worlds -- http://127.0.0.1:8080
          npm run test:export -- http://127.0.0.1:8080
          npm run test:car -- http://127.0.0.1:8080
          npm run test:urlload -- http://127.0.0.1:8080
      - name: Exercise the staged production artifact
        run: |
          npm run stage:site
          SITE_ROOT=_site HOST=127.0.0.1 PORT=8090 node tools/serve.js > .smoke/staged-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:bootstrap -- http://127.0.0.1:8090
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audio-smoke
          path: .smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  world-chooser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the game
        uses: ./.github/actions/setup
        with:
          browser: true
      - name: Exercise pointer and keyboard world selection
        run: |
          mkdir -p .smoke
          HOST=127.0.0.1 node tools/serve.js > .smoke/chooser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:chooser -- http://127.0.0.1:8080
          npm run test:chooser-keyboard -- http://127.0.0.1:8080
      - name: Upload chooser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: world-chooser
          path: .smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
