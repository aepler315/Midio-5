# Reusable validation for pull requests and the Pages deployment gate.
name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install game dependencies
        run: npm ci --no-fund --no-audit
      - name: Lint
        run: npm run lint
      - name: Run test suite
        run: npm test

  audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install game dependencies
        run: npm ci --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise audio upload and playback
        run: |
          mkdir -p .smoke
          HOST=127.0.0.1 node tools/serve.js > .smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:smoke -- http://127.0.0.1:8080
          npm run test:lighting -- http://127.0.0.1:8080
          npm run test:shading -- http://127.0.0.1:8080
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audio-smoke
          path: .smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
