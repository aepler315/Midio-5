# Browser evidence for The Range landscape correction.
# A green unit run is not a picture. This job keeps the captures.
name: Landscape visual

on:
  pull_request:
  workflow_dispatch:
    inputs:
      preset:
        description: Landscape preset
        default: primary
        type: choice
        options: [primary, full]

permissions:
  contents: read

jobs:
  landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the game
        uses: ./.github/actions/setup
        with:
          browser: true
      - name: Capture the primary Range preset
        run: |
          mkdir -p .smoke
          npm run stage:site
          SITE_ROOT=_site HOST=127.0.0.1 PORT=8091 node tools/serve.js > .smoke/landscape-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/range-landscape-smoke.mjs \
            --url http://127.0.0.1:8091 \
            --source-root . \
            --expect-sha "${{ github.sha }}" \
            --preset ${{ github.event.inputs.preset || 'primary' }} \
            --output .smoke/range-correction
      - name: Upload landscape evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: landscape-visual
          path: .smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
