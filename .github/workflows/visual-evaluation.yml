name: Visual evaluation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'tools/visual-evaluate.mjs'
      - 'tools/lib/visual-evaluation*.mjs'
      - 'test/fixtures/visual-evaluation*.json'
      - '.github/workflows/visual-evaluation.yml'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          browser: true
      - name: Capture diagnostic corpus
        run: npm run visual:eval -- --out .smoke/visual-evaluation/baseline
      - name: Repeat identical corpus
        run: npm run visual:eval -- --out .smoke/visual-evaluation/repeat
      - name: Compare identical inputs
        run: npm run visual:eval -- --compare .smoke/visual-evaluation/baseline .smoke/visual-evaluation/repeat --out .smoke/visual-evaluation/comparison
      - name: Retain real rendered evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-evaluation
          path: .smoke/visual-evaluation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
