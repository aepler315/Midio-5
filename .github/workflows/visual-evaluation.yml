name: Visual evaluation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'tools/visual-evaluate.mjs'
      - 'tools/lib/visual-evaluation*.mjs'
      - 'test/fixtures/visual-evaluation*.json'
      - '.github/workflows/visual-evaluation.yml'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  songs:
    # One capture job per corpus recording, read from the fixture so a song
    # added there is never silently left out of CI.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.read.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: test/fixtures
      - id: read
        run: echo "ids=$(node -e 'console.log(JSON.stringify(require("./test/fixtures/visual-evaluation.json").songs.map(s => s.id)))')" >> "$GITHUB_OUTPUT"

  capture:
    needs: songs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        song: ${{ fromJSON(needs.songs.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          browser: true
      - name: Select one complete recording from the shared corpus
        env:
          VISUAL_SONG: ${{ matrix.song }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const corpus = JSON.parse(fs.readFileSync('test/fixtures/visual-evaluation.json', 'utf8'));
          const songs = corpus.songs.filter(song => song.id === process.env.VISUAL_SONG);
          if (songs.length !== 1) throw new Error('Expected exactly one corpus recording');
          fs.mkdirSync('.smoke/visual-evaluation', { recursive: true });
          fs.writeFileSync('.smoke/visual-evaluation/corpus.json', JSON.stringify({ ...corpus, songs }));
          NODE
      - name: Capture diagnostic corpus
        run: npm run visual:eval -- --manifest .smoke/visual-evaluation/corpus.json --out .smoke/visual-evaluation/baseline
      - name: Repeat identical corpus
        run: npm run visual:eval -- --manifest .smoke/visual-evaluation/corpus.json --out .smoke/visual-evaluation/repeat
      - name: Compare identical inputs
        # Software WebGL renders identical inputs byte-for-byte; any differing
        # PNG means nondeterministic rendering and fails the job.
        run: npm run visual:eval -- --compare .smoke/visual-evaluation/baseline .smoke/visual-evaluation/repeat --out .smoke/visual-evaluation/comparison --require-identical
      - name: Retain real rendered evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-evaluation-${{ matrix.song }}
          path: .smoke/visual-evaluation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
