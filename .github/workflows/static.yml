# Deploy the static game to GitHub Pages. Only what the page actually
# needs (index.html, src/, soundfonts/) plus CNAME/.nojekyll get staged
# and uploaded -- not the whole repo. Previously `path: '.'` published the
# entire checkout, including test/ (a third of the tracked payload),
# tools/ (readable Node source for the local dev bridge), docs/,
# docker-compose.yml, and slskd/slskd.yml (a local-dev API key/credentials
# file, not a real secret but not something that belongs on the public
# site either). This also used to run without a .nojekyll marker, so
# GitHub's Jekyll processor silently touched the upload (confirmed:
# /soundfonts/ rendered as a Jekyll-templated page of its README) -- a
# latent trap for any future `_`-prefixed file. Both are fixed by staging
# explicitly rather than uploading the raw checkout.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage public site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp CNAME _site/
          touch _site/.nojekyll
          cp -r src _site/src
          cp -r soundfonts _site/soundfonts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
