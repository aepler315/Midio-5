# ILLUSTRATIVE FIXTURE for tests only. No recording was heard. Times and
# ratings are invented to exercise bookkeeping: a foreground reversal while
# loudness stays the same, an uncertain transition interval, a gap, and an
# emotion left unrated. It must never enter a scored evaluation.
format: midio-listening/0.1
status: illustrative
audio_file: "fixture.flac"
listener: "fixture"
perspective: expressed
basis: sound
summary: "Smiling through grief: bright and playful on top, sorrow underneath that takes over without getting louder."
segments:
  - span: ["00:00", "00:20"]
    label: "playful surface"
    sound: {brightness: 4, loudness: 2, pulse: steady}
    emotions:
      playfulness: {intensity: 3, role: foreground}
      sadness: {intensity: 3, role: undertone}
    confidence: high
    notes: "Both are strong; the sadness is underneath."
  - span: ["00:30", "01:00.000"]
    label: "sorrow leads"
    sound: {brightness: 4, loudness: 2}
    emotions:
      playfulness: {intensity: 1, role: undertone}
      sadness: {intensity: 4, role: foreground}
      joy: {intensity: null, role: unclear}
    affect: {valence: -1, arousal: null}
    confidence: medium
trends:
  - span: ["00:00", "00:20"]
    target: sound.loudness
    direction: stable
    confidence: medium
events:
  - within: ["00:18", "00:32"]
    type: foreground_change
    from: playfulness
    to: sadness
    confidence: low
